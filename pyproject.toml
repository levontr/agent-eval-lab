[project]
name = "support-agent-lab"
version = "0.1.0"
description = "Learn to build and evaluate a small customer-support agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "openinference-semantic-conventions>=0.1.42",
    "opentelemetry-sdk>=1.45.1",
]

[project.scripts]
support-agent = "support_agent_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
